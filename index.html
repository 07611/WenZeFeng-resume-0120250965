<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>温泽锋 - 个人简历</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23174ea6'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23ffffff' font-family='sans-serif'%3E温%3C/text%3E%3C/svg%3E">

  <!-- 链入式 CSS：引入外部样式文件 s1.css（A4 纸张、页面背景、打印规则） -->
  <link href="s1.css" rel="stylesheet">

  <!-- 内嵌式 CSS：写在 <style> 标签内的样式（版式与细节） -->
  <style>
    /* ===== 头部 ===== */
    .head {
      border-bottom: 2px solid #174ea6;
      padding-bottom: 14px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 2px;
    }

    .sub {
      font-size: 14px;
      color: #667085;
      margin: 2px 0 12px;
    }

    .github {
      font-size: 13px;
      font-weight: 600;
    }

    .github:hover {
      opacity: 0.75;
    }

    /* ===== 章节标题：左侧色条 + 底部分隔线 ===== */
    section {
      margin-bottom: 18px;
    }

    h2 {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
      margin: 0 0 10px;
      padding-left: 10px;
      border-left: 4px solid #174ea6;
    }

    p {
      margin: 4px 0;
      font-size: 14.5px;
    }

    /* ===== 基本信息：两列排布 ===== */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 28px;
      margin: 0;
    }

    .info-grid > div {
      display: flex;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px dashed #e8ecf3;
      font-size: 14.5px;
    }

    .info-grid dt {
      font-weight: 600;
      color: #3d4553;
      min-width: 4em;
    }

    .info-grid dd {
      margin: 0;
      color: #20242c;
    }

    /* ===== 打印按钮（仅屏幕显示） ===== */
    .print-btn {
      position: fixed;
      right: 28px;
      bottom: 28px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 20px;
      min-height: 44px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background-color: #174ea6;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(23, 78, 166, 0.35);
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .print-btn:hover {
      background-color: #123f86;
      transform: translateY(-1px);
    }

    .print-btn svg {
      width: 18px;
      height: 18px;
    }

    /* ===== 打招呼按钮与提示 ===== */
    .greet {
      margin-top: 14px;
      padding: 8px 16px;
      min-height: 44px;
      font-family: inherit;
      font-size: 14px;
      color: #174ea6;
      background-color: #ffffff;
      border: 1px solid #174ea6;
      border-radius: 8px;
      cursor: pointer;
    }

    .greet:hover {
      background-color: #f0f4fb;
    }

    #msg {
      margin: 8px 0 0;
      min-height: 20px;
      font-size: 14px;
      color: #174ea6;
    }

    /* 窄屏下打印按钮不再悬浮，回归文档流，避免遮挡内容 */
    @media screen and (max-width: 760px) {
      .print-btn {
        position: static;
        margin: 0 0 14px;
      }
    }
  </style>
</head>
<body>

  <!-- 行内式 JavaScript：用 onclick 属性直接写调用 -->
  <button class="print-btn no-print" onclick="window.print()" title="打印 / 导出为 PDF">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="6 9 6 2 18 2 18 9"></polyline>
      <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
      <rect x="6" y="14" width="12" height="8"></rect>
    </svg>
    打印简历
  </button>

  <!-- A4 纸张主体 -->
  <div class="page">

    <header class="head">
      <h1>温泽锋</h1>
      <p class="sub">广东科学技术职业学院 · 在读</p>

      <!-- 行内式 CSS：用 style 属性直接在标签上写样式 -->
      <a class="github" style="display:inline-flex;align-items:center;gap:6px;color:#174ea6;text-decoration:none;" href="https://github.com/07611">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="#174ea6" aria-hidden="true">
          <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.72-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.25 5.67.41.35.77 1.05.77 2.12 0 1.53-.01 2.76-.01 3.14 0 .3.2.67.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"></path>
        </svg>
        github.com/07611
      </a>
    </header>

    <section>
      <h2>基本信息</h2>
      <dl class="info-grid">
        <div><dt>出生日期</dt><dd>2007-06-11</dd></div>
        <div><dt>性别</dt><dd>男</dd></div>
        <div><dt>籍贯</dt><dd class="todo">广东</dd></div>
        <div><dt>居住地</dt><dd class="todo">广东深圳</dd></div>
        <div><dt>邮箱</dt><dd class="todo">3167366562@qq.com</dd></div>
        <div><dt>电话</dt><dd class="todo">13016357136</dd></div>
      </dl>
    </section>

    <section>
      <h2>个人经历</h2>
      <p>广东科学技术职业学院（在读）</p>
    </section>

    <section>
      <h2>兴趣爱好</h2>
      <p class="todo">篮球、舞蹈、旅游、咖啡、健身</p>
    </section>

    <section>
      <h2>项目</h2>
      <p class="todo">ai招聘网 舞蹈拆分系统</p>
    </section>

    <section>
      <h2>竞赛</h2>
      <p class="todo">校赛数学建模3等奖 设计大赛省3</p>
    </section>

    <!-- 行内式 JavaScript：用 onclick 属性直接写调用 -->
    <button class="greet no-print" onclick="showMsg()">点我打个招呼</button>
    <p id="msg"></p>

    <footer>
      <p id="time"></p>
    </footer>

  </div>

  <!-- 内嵌式 JavaScript：写在 <script> 标签内的代码 -->
  <script>
    function showMsg() {
      var el = document.getElementById("msg");
      if (el) {
        el.innerHTML = "你好，我是温泽锋，来自广东科学技术职业学院。";
      }
    }
  </script>

  <!-- 外链式（链入式）JavaScript：引入外部脚本文件 s1.js -->
  <script src="s1.js"></script>
</body>
</html>
